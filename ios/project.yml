name: Sublight
options:
  bundleIdPrefix: observer.sublight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Sublight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sublight
      - path: Resources/fonts        # group → flattened into bundle root (UIAppFonts)
      - path: Resources/data
        type: folder                 # folder reference — preserves data/ subpath
      - path: Resources/frames
        type: folder
      - path: Resources/bodies
        type: folder
      - path: Resources/tracks
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: observer.sublight.app
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "6"
        # No DEVELOPMENT_TEAM here on purpose. Pinning it to "" made xcodegen
        # write an empty team into the target, and archiving then failed before
        # compiling with "Signing for Sublight requires a development team".
        # Pick the team once in Xcode (Signing & Capabilities); it is stored in
        # the generated .xcodeproj, which is gitignored, so it never leaves this
        # machine. Re-pick it after any `xcodegen generate`.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Sublight/Info.plist
      properties:
        CFBundleDisplayName: Sublight
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "6"
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - observer.sublight.refresh
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - RobotoMono-Regular.ttf
          - RobotoMono-Medium.ttf
          - RobotoMono-Bold.ttf
          - StackSansNotch-Regular.ttf
          - StackSansNotch-SemiBold.ttf
          - StackSansNotch-Bold.ttf

schemes:
  Sublight:
    build:
      targets:
        Sublight: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
