name: Sublight
options:
  bundleIdPrefix: observer.sublight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Sublight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sublight
      - path: Resources/fonts        # group → flattened into bundle root (UIAppFonts)
      - path: Resources/data
        type: folder                 # folder reference — preserves data/ subpath
      - path: Resources/frames
        type: folder
      - path: Resources/bodies
        type: folder
      - path: Resources/tracks
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: observer.sublight.app
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Sublight/Info.plist
      properties:
        CFBundleDisplayName: Sublight
        CFBundleShortVersionString: "0.4.0"
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - observer.sublight.refresh
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - RobotoMono-Regular.ttf
          - RobotoMono-Medium.ttf
          - RobotoMono-Bold.ttf
          - StackSansNotch-Regular.ttf
          - StackSansNotch-SemiBold.ttf
          - StackSansNotch-Bold.ttf
