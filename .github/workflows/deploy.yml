name: deploy

# Build the static site and publish it to Cloudflare Pages.
# Runs on every push to main and can be triggered by hand. The daily data
# refresh (refresh.yml) deploys separately after it commits fresh data.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        run: |
          npx wrangler pages project create sublight --production-branch main 2>/dev/null || true
          npx wrangler pages deploy dist --project-name sublight --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
