<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sublight: the latest photos from Mars, as they arrive</title>
    <meta
      name="description"
      content="The newest photos from the Mars rovers, in the order their light reached Earth. Nothing you see is happening now."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The first photo comes from here, and the first post needs these files. -->
    <link rel="preconnect" href="https://mars.nasa.gov" />
    <link rel="preload" href="/data/frames.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/fleet.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/planets.json" as="fetch" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sublight" />
    <meta property="og:url" content="https://sublight.observer/" />
    <meta property="og:title" content="Sublight" />
    <meta
      property="og:description"
      content="The newest photos from the Mars rovers, in the order their light reached Earth."
    />
    <meta property="og:image" content="https://sublight.observer/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sublight. Nothing you see is happening now. Voyager 1 one-way light-time."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sublightapp" />
    <meta name="twitter:title" content="Sublight" />
    <meta
      name="twitter:description"
      content="The newest photos from the Mars rovers, in the order their light reached Earth."
    />
    <meta name="twitter:image" content="https://sublight.observer/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
